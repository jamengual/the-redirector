version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment  # Too strict for this project
    misspell:
      locale: US

  exclusions:
    rules:
      # Test files can have unused parameters
      - path: _test\.go
        linters:
          - unused
      # Main files often have simple error handling
      - path: cmd/
        linters:
          - errcheck
        text: "Error return value of .*(Close|Log|Print)"

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/jamengual/the-redirector
