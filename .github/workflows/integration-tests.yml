name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      # LocalStack for AWS services (S3, SSM, Secrets Manager)
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ssm,secretsmanager
          DEBUG: "0"
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Azurite for Azure Blob Storage
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        options: >-
          --health-cmd "nc -z localhost 10000 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Fake GCS Server
      fake-gcs:
        image: fsouza/fake-gcs-server:latest
        ports:
          - 4443:4443
        options: >-
          --health-cmd "wget -q --spider http://localhost:4443/storage/v1/b || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Consul
      consul:
        image: hashicorp/consul:latest
        ports:
          - 8500:8500
        env:
          CONSUL_BIND_INTERFACE: eth0
        options: >-
          --health-cmd "consul members"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # etcd
      etcd:
        image: quay.io/coreos/etcd:v3.5.9
        ports:
          - 2379:2379
        env:
          ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
          ETCD_ADVERTISE_CLIENT_URLS: http://localhost:2379
        options: >-
          --health-cmd "etcdctl endpoint health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install

      - name: Install Consul CLI
        run: |
          wget -q -O consul.zip https://releases.hashicorp.com/consul/1.17.0/consul_1.17.0_linux_amd64.zip
          unzip -q consul.zip
          sudo mv consul /usr/local/bin/

      - name: Install etcd CLI
        run: |
          wget -q https://github.com/etcd-io/etcd/releases/download/v3.5.9/etcd-v3.5.9-linux-amd64.tar.gz
          tar xzf etcd-v3.5.9-linux-amd64.tar.gz
          sudo mv etcd-v3.5.9-linux-amd64/etcdctl /usr/local/bin/

      - name: Wait for services
        run: |
          echo "Waiting for services to be fully ready..."
          sleep 10

          # Verify LocalStack
          curl -sf http://localhost:4566/_localstack/health || exit 1
          echo "LocalStack ready"

          # Verify Azurite
          nc -z localhost 10000 || exit 1
          echo "Azurite ready"

          # Verify Fake GCS
          curl -sf http://localhost:4443/storage/v1/b || exit 1
          echo "Fake GCS ready"

          # Verify Consul
          consul members || exit 1
          echo "Consul ready"

          # Verify etcd
          etcdctl endpoint health || exit 1
          echo "etcd ready"

      - name: Setup test data
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          CONSUL_HTTP_ADDR: 127.0.0.1:8500
          ETCDCTL_ENDPOINTS: http://127.0.0.1:2379
        run: |
          # Test config content
          cat > /tmp/config.yaml << 'EOF'
          version: "1.0"
          rules:
            - id: test-redirect
              match:
                type: exact
                path: /old
              redirect:
                to: https://new.example.com/
                status: 301
          EOF

          CONFIG_YAML=$(cat /tmp/config.yaml)

          # S3
          aws --endpoint-url=http://localhost:4566 s3 mb s3://test-config
          aws --endpoint-url=http://localhost:4566 s3 cp /tmp/config.yaml s3://test-config/redirector.yaml
          echo "S3 setup complete"

          # Parameter Store
          aws --endpoint-url=http://localhost:4566 ssm put-parameter \
            --name "/redirector/config" \
            --value "$CONFIG_YAML" \
            --type String \
            --overwrite
          echo "Parameter Store setup complete"

          # Secrets Manager
          aws --endpoint-url=http://localhost:4566 secretsmanager create-secret \
            --name "redirector/config" \
            --secret-string "$CONFIG_YAML" 2>/dev/null || \
          aws --endpoint-url=http://localhost:4566 secretsmanager put-secret-value \
            --secret-id "redirector/config" \
            --secret-string "$CONFIG_YAML"
          echo "Secrets Manager setup complete"

          # Fake GCS
          curl -sf -X POST "http://localhost:4443/storage/v1/b?project=test" \
            -H "Content-Type: application/json" \
            -d '{"name": "test-config"}' || true
          curl -sf -X POST "http://localhost:4443/upload/storage/v1/b/test-config/o?uploadType=media&name=redirector.yaml" \
            -H "Content-Type: application/x-yaml" \
            --data-binary "@/tmp/config.yaml"
          echo "GCS setup complete"

          # Consul
          consul kv put redirector/config "$CONFIG_YAML"
          echo "Consul setup complete"

          # etcd
          etcdctl put /redirector/config "$CONFIG_YAML"
          echo "etcd setup complete"

      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
          STORAGE_EMULATOR_HOST: http://localhost:4443
        run: |
          go test -tags=integration -v ./test/integration/...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test/integration/*.log
          retention-days: 7
