name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io

jobs:
  # Normalize version from either trigger source
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      docker_version: ${{ steps.resolve.outputs.docker_version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "docker_version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

  # Run tests before release
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test -v -race ./...

  # Build binaries for all platforms
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [test, resolve-version]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          mkdir -p dist

          # Set binary extension for Windows
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build all binaries
          for cmd in redirector redirector-sync redirector-tui; do
            OUTPUT="dist/${cmd}-${GOOS}-${GOARCH}${EXT}"
            CGO_ENABLED=0 go build \
              -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
              -o "${OUTPUT}" \
              "./cmd/${cmd}"
          done

          # Create archive
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "../the-redirector-${VERSION}-${GOOS}-${GOARCH}.zip" *
          else
            tar -czvf "../the-redirector-${VERSION}-${GOOS}-${GOARCH}.tar.gz" *
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            the-redirector-*.tar.gz
            the-redirector-*.zip
          if-no-files-found: error

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, resolve-version]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: release-*

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} release-assets/ \;

          # Generate checksums
          cd release-assets
          sha256sum * > checksums.txt

      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p' || echo "")

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${VERSION}"
          else
            RANGE="${VERSION}"
          fi

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          # Collect commits by category
          FEATURES=""
          FIXES=""
          IMPROVEMENTS=""
          REMOVALS=""
          OTHER=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              Add*|Implement*)
                FEATURES="${FEATURES}- ${line}"$'\n' ;;
              Fix*)
                FIXES="${FIXES}- ${line}"$'\n' ;;
              Update*|Improve*|Rename*|Simplify*)
                IMPROVEMENTS="${IMPROVEMENTS}- ${line}"$'\n' ;;
              Remove*)
                REMOVALS="${REMOVALS}- ${line}"$'\n' ;;
              *)
                OTHER="${OTHER}- ${line}"$'\n' ;;
            esac
          done < <(git log --pretty=format:"%s" "$RANGE" 2>/dev/null || echo "")

          if [ -n "$FEATURES" ]; then
            echo "### New Features" >> release_notes.md
            echo "$FEATURES" >> release_notes.md
          fi

          if [ -n "$FIXES" ]; then
            echo "### Bug Fixes" >> release_notes.md
            echo "$FIXES" >> release_notes.md
          fi

          if [ -n "$IMPROVEMENTS" ]; then
            echo "### Improvements" >> release_notes.md
            echo "$IMPROVEMENTS" >> release_notes.md
          fi

          if [ -n "$REMOVALS" ]; then
            echo "### Removals" >> release_notes.md
            echo "$REMOVALS" >> release_notes.md
          fi

          if [ -n "$OTHER" ]; then
            echo "### Other Changes" >> release_notes.md
            echo "$OTHER" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: Release ${{ needs.resolve-version.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.resolve-version.outputs.version, '-') }}
          body_path: release_notes.md
          files: |
            release-assets/*

  # Build and push Docker image
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, resolve-version]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.version }}

      - name: Compute Docker tags
        id: tags
        env:
          DOCKER_VERSION: ${{ needs.resolve-version.outputs.docker_version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Parse semver components (e.g., 1.2.3 from v1.2.3)
          MAJOR=$(echo "$DOCKER_VERSION" | cut -d. -f1)
          MINOR=$(echo "$DOCKER_VERSION" | cut -d. -f2)

          TAGS="${IMAGE}:${DOCKER_VERSION}"
          TAGS="${TAGS},${IMAGE}:${MAJOR}.${MINOR}"
          TAGS="${TAGS},${IMAGE}:${MAJOR}"
          TAGS="${TAGS},${IMAGE}:latest"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Docker tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
