apiVersion: v1
kind: Service
metadata:
  name: {{ include "the-redirector.fullname" . }}
  labels:
    {{- include "the-redirector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "the-redirector.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "the-redirector.fullname" . }}-management
  labels:
    {{- include "the-redirector.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: {{ .Values.managementService.type }}
  ports:
    - port: {{ .Values.managementService.port }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "the-redirector.selectorLabels" . | nindent 4 }}
